<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CARE Examen Médico</title>
<meta name="theme-color" content="#234561">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CARE Médico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{--navy:#234561;--navy2:#1a3550;--green:#2EA65E;--green2:#24894d;--bg:#f2f5f8;--card:#fff;--ink:#14263a;--mut:#5b6b7c;--line:#d6dee6;
--ok:#2EA65E;--info:#2f7bd0;--warn:#e0a106;--bad:#d9534f;--flag:#b0221c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:4px solid var(--green);box-shadow:0 2px 8px #0001}
.logo{height:46px;width:auto}.tt{flex:1;display:flex;flex-direction:column}.tt b{color:var(--navy);font-size:19px}.tt span{color:var(--mut);font-size:13px}
.ghost{background:none;border:2px solid var(--navy);color:var(--navy);border-radius:12px;padding:10px 16px;font-weight:700}
.steps{position:sticky;top:66px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--navy);scrollbar-width:none}
.st{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 14px;background:#ffffff1a;color:#dfe8f1;font-size:14px;white-space:nowrap;min-height:44px}
.st.done{background:#2ea65e55;color:#fff}.st.on{background:var(--green);color:#fff;font-weight:700}.st i{font-style:normal}
.wrap{display:grid;grid-template-columns:1fr;gap:16px;max-width:1280px;margin:0 auto;padding:16px 16px 110px}
@media(min-width:960px){.wrap{grid-template-columns:1fr 340px}.agent{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}.chipA{display:none}}
.sec,.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 4px #0000000f}
.sec h2{margin:0 0 6px;color:var(--navy);font-size:24px}.note{color:var(--mut);margin:0 0 12px;font-size:15px}
h3.sub{margin:22px 0 8px;color:var(--green2);font-size:17px;border-bottom:2px solid #2ea65e33;padding-bottom:4px}
.items{display:flex;flex-direction:column;gap:6px}.items.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.items.grid2{grid-template-columns:1fr 1fr}}
.it{padding:10px 0;border-bottom:1px solid #eef2f5}.it>label{display:block;font-weight:650;margin-bottom:8px}.it label small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.it.yn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.it.yn>label{margin:0}.it.yn>.in,.it.yn>.pill{grid-column:1/-1}
.req{color:var(--bad);font-style:normal;margin-left:3px}.it.miss{background:#fdecec;border-radius:12px;padding:10px}
.bt2{display:flex;gap:8px}.bt2 .ob{min-width:92px}
.bts{display:grid;gap:8px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(2,1fr)}.c4{grid-template-columns:repeat(2,1fr)}.c5{grid-template-columns:repeat(3,1fr)}
@media(min-width:620px){.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}}
.ob{min-height:56px;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);font-weight:600;text-align:center;line-height:1.2}
.ob small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:3px}
.ob.on{background:var(--navy);border-color:var(--navy);color:#fff}.ob.on small{color:#cfe0ef}.ob.on.n{background:var(--green);border-color:var(--green)}.ob.on.y{background:#c9821b;border-color:#c9821b}
.in{width:100%;min-height:54px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:#fff;color:var(--ink)}.in:focus{outline:3px solid #2ea65e55;border-color:var(--green)}
.in.sm{min-height:46px;margin-top:8px}textarea.in{resize:vertical}
.nrow{display:flex;align-items:center;gap:10px}.nrow .in{max-width:220px;font-size:22px;font-weight:700}.u{color:var(--mut)}
.cv{font-size:22px;font-weight:800;color:var(--navy)}
.pill{margin-top:6px;font-size:14px;border-radius:10px;padding:0}.pill:not(:empty){padding:6px 10px}
.pill.s0:not(:empty){background:#e9f6ee;color:#1d6b3e}.pill.s1{background:#e8f1fb;color:#1f5aa0}.pill.s2{background:#fff2cc;color:#7a5600}.pill.s3{background:#f8d7da;color:#8a1f1a}.pill.s4{background:#b0221c;color:#fff;font-weight:700}
.allno{margin-bottom:8px}
.btn{min-height:56px;padding:12px 22px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:800;font-size:17px}
.btn.sec{background:#e3eaf1;color:var(--navy)}.btn.go{background:var(--navy)}.btn.danger{background:var(--bad)}.btn.sm{min-height:44px;padding:8px 14px;font-size:15px}.btn:disabled{opacity:.4}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px #0000000d}
.nav .btn{flex:0 0 auto}
.chipA{flex:1;min-height:52px;border:0;border-radius:14px;font-weight:800;font-size:14px;color:#fff;padding:6px 10px}
.chipA.ok,.verdict.ok{background:var(--ok)}.chipA.info,.verdict.info{background:var(--info)}.chipA.warn,.verdict.warn{background:var(--warn)}.chipA.bad,.verdict.bad{background:var(--bad)}.chipA.flag,.verdict.flag{background:var(--flag)}
.agent{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 4px #0000000f}
@media(max-width:959px){.agent{position:fixed;left:0;right:0;bottom:76px;z-index:25;max-height:65vh;overflow:auto;border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .25s;box-shadow:0 -8px 30px #0003}.agent.open{transform:none}}
.ag-h{font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #2ea65e33;animation:p 1.6s infinite}@keyframes p{50%{box-shadow:0 0 0 8px #2ea65e11}}
.verdict{color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.verdict small{opacity:.85;font-size:12px}.verdict b{font-size:18px}.verdict span{font-size:13px;opacity:.95}
.verdict.vbig b{font-size:26px}
.flagbox{margin-top:10px;background:#b0221c;color:#fff;border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.edt{margin-top:10px;background:#fff2cc;color:#7a5600;border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.agent h4{margin:14px 0 6px;color:var(--navy)}
.fl,.nx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fl li{border-left:5px solid var(--line);padding:6px 10px;background:#f7f9fb;border-radius:8px;font-size:14px}.fl li b{display:block}.fl li em{color:var(--mut)}
.fl .s1{border-color:var(--info)}.fl .s2{border-color:var(--warn)}.fl .s3{border-color:var(--bad)}.fl .s4{border-color:var(--flag);background:#fbe4e2}
.nx li{font-size:14px;padding:6px 10px;background:#eef6f1;border-radius:8px}.nx li:before{content:"→ ";color:var(--green2);font-weight:800}
.study.sug label{color:var(--navy)}details summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--navy)}
.sigs{display:grid;gap:12px}@media(min-width:700px){.sigs{grid-template-columns:1fr 1fr}}
.sig canvas{width:100%;height:auto;aspect-ratio:600/220;border:2px dashed var(--navy);border-radius:14px;background:#fbfcfd;touch-action:none}
.sl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--mut)}
.home{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}.home h1{color:var(--navy);margin:0}
.hero{background:linear-gradient(120deg,var(--navy) 0 62%,var(--green) 62%);color:#fff;border-radius:22px;padding:24px}.hero h1{color:#fff;font-size:30px}.hero p{max-width:560px}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.stat div{background:#ffffff22;border-radius:14px;padding:10px 16px;display:flex;flex-direction:column}.stat b{font-size:22px}.stat span{font-size:13px;opacity:.9}
.bigrow{display:grid;gap:14px}@media(min-width:620px){.bigrow{grid-template-columns:1fr 1fr}}
.big{min-height:130px;border:0;border-radius:22px;background:var(--green);color:#fff;font-size:22px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px}
.big span{font-size:38px;line-height:1}.big small{font-size:14px;font-weight:500;opacity:.9}.big.alt{background:var(--navy)}.big:disabled{opacity:.35}
.alert{border:3px solid var(--warn)}.alert h2{margin-top:0;color:#7a5600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.chk{display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:600}.chk input{width:26px;height:26px}
.done{text-align:center}.done .ok{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--green);color:#fff;font-size:48px;display:grid;place-items:center}
.tag{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:8px;color:#fff;font-style:normal;font-weight:700;font-size:13px}
.tag.ok{background:var(--ok)}.tag.info{background:var(--info)}.tag.warn{background:var(--warn)}.tag.bad{background:var(--bad)}.tag.flag{background:var(--flag)}
.hist{display:flex;flex-direction:column;gap:10px}.hrow{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 3px #0000000f}
.hrow span{display:block;color:var(--mut);font-size:14px}
.log{max-height:300px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;transition:.25s;max-width:90vw;font-weight:600}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.tt span{display:none}.tt b{font-size:17px}.logo{height:40px}.top{padding:8px 12px}.steps{top:60px}}
.adp{margin-top:10px;padding:12px;border-radius:14px;background:#f3f7fa;display:flex;flex-direction:column;gap:8px}.adp>label{font-weight:650}
</style>
</head>

/* ===== utilidades clínicas ===== */
function age(f){ if(!f) return null; const d=new Date(f+'T12:00'), n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) a--; return a>=0&&a<120?a:null; }
const has=(S,c)=>S.chips.includes(c);
const hasAny=(S,arr)=>arr.some(c=>S.chips.includes(c));
const pos=(S,id)=>['Sí','Positivo','Alterado'].includes(S.a[id]);
function bp(s,d,S){ if(!s||!d) return {i:'Capture ambas cifras'}; const crit=hasAny(S,CRIT);
  if(s>=180||d>=110) return {flag:1,s:3,i:'Crisis hipertensiva (≥180/110): referencia inmediata'};
  if(s>=160||d>=100) return {s:crit?3:2,i:'HAS grado 2 sin control: '+(crit?'incompatible temporalmente con tareas críticas':'control médico'),rx:'Sin tareas críticas hasta controlar la presión arterial'};
  if(s>=140||d>=90) return {s:crit?2:1,i:'Cifras de HAS grado 1: repetir toma tras 5 min y confirmar',rc:'Confirmar hipertensión con tomas seriadas y referir a su UMF'};
  if(s>=130||d>=85) return {s:1,i:'Presión normal alta',rc:'Vigilar presión arterial'};
  if(s<90||d<60) return {s:1,i:'Hipotensión'};
  return {i:'Normal'}; }
function visual(S){ const ix=x=>VA.indexOf(x); const o=[S.a.va_od,S.a.va_oi].filter(x=>x&&x!=='No evaluado'); if(!o.length) return null;
  const w=Math.max(...o.map(ix)), crit=hasAny(S,VIS), lab=VA[w]+(S.a.va_lentes==='Con lentes'?' (corregida)':'');
  if(w>=7) return {v:'Peor ojo '+lab,s:crit?3:2,i:'Baja visión importante',rx:'Sin conducción ni maquinaria; valoración oftalmológica'};
  if(w>=4) return {v:'Peor ojo '+lab,s:crit?2:1,i:'Agudeza visual disminuida (> 20/40)',rx:'Uso obligatorio de corrección óptica; optometría'};
  return {v:'Peor ojo '+lab,i:'Agudeza visual funcional (≤ 20/40)'}; }

/* ===== IndexedDB ===== */
const DB={ db:null,
  open(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('care_sm',1); r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('exams',{keyPath:'folio'}); d.createObjectStore('meta',{keyPath:'k'}); d.createObjectStore('audit',{autoIncrement:true}); }; r.onsuccess=()=>{DB.db=r.result;ok()}; r.onerror=()=>ko(r.error); }); },
  tx(st,mode,fn){ return new Promise((ok,ko)=>{ const t=DB.db.transaction(st,mode); let out; t.oncomplete=()=>ok(out); t.onerror=t.onabort=()=>ko(t.error||new Error('Transacción abortada')); out=fn(t); }); },
  req(r){ return new Promise((ok,ko)=>{ r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); },
  get(st,k){ return DB.req(DB.db.transaction(st).objectStore(st).get(k)); },
  all(st){ return DB.req(DB.db.transaction(st).objectStore(st).getAll()); },
  put(st,v){ return DB.tx(st,'readwrite',t=>t.objectStore(st).put(v)); },
};
async function audit(ev,det){ await DB.put('audit',{fecha:new Date().toISOString(),ev,det}); }

/* ===== motor de análisis ===== */
function visibleItems(sec){ const out=[]; let hdrOk=true;
  for(const it of sec.items||[]){
    if(it.t==='h'){ hdrOk=(!it.rel||hasAny(S,it.rel))&&(!it.when||it.when(S)); if(hdrOk) out.push(it); continue; }
    if(!hdrOk) continue;
    if(it.when&&!it.when(S)) continue;
    if(it.rel&&!hasAny(S,it.rel)) continue;
    out.push(it); }
  return out; }
function evalItem(it){
  const v=S.a[it.id]; let r=null;
  if(it.t==='calc'){ r=it.f(S); if(!r) return null; return {ans:r.v, interp:r.i||'', sev:r.s||0, flag:r.flag, rx:r.rx, rc:r.rc}; }
  if(it.t==='multi'){ if(!v||!v.length) return v?{ans:'Ninguno',interp:'Sin síntomas referidos',sev:0}:null; r={ans:v.join(', '),s:it.s,i:'Dolor referido en: '+v.join(', ')}; }
  else if(v==null||v==='') return null;
  else if(it.t==='yn'){ r= v==='Sí'?{s:it.s??1,i:it.p||'Positivo',flag:it.flag}:{s:0,i:it.n||'Negado'}; if(v==='Sí'&&S.a[it.id+'_det']) r.ans='Sí — '+S.a[it.id+'_det']; }
  else if(it.t==='seg'){ r= v==='Alterado'?{s:it.s??1,i:'Alterado: '+(S.a[it.id+'_n']||'sin descripción')}:{s:0,i:v==='Normal'?'Sin alteraciones':'No evaluado'}; }
  else if(it.t==='opt'){ const o=it.o.find(x=>(x.v??x)===v); r=typeof o==='object'?{s:o.s||0,i:o.i??'',flag:o.flag}:{s:0,i:''}; if(it.man&&v==='Positivo') r.i=it.p; }
  else if(it.t==='num'){ r=it.f?it.f(+v,S):{}; r.ans=v+' '+(it.unit||''); }
  else r={s:0,i:''};
  let sev=r.s||0;
  if(sev>0&&it.r&&!hasAny(S,it.r)) sev=Math.min(sev, it.s0??r.s0??1);
  const relevant=sev>0&&it.r&&hasAny(S,it.r);
  const showRx = sev>=2;
  return {ans:r.ans??v, interp:r.i||'', sev, flag:r.flag||it.flag&&sev>0, rx:showRx?(r.rx||it.rx):'', rc:(r.rc||it.rc||(sev===1?'':'' )), edt:it.edt&&sev>0, wr:it.wr&&v==='Sí', rel:relevant?it.r.filter(c=>has(S,c)):null };
}
const LEVELS={
  std:[ {l:'APTO',c:'ok',d:'Sin hallazgos que limiten el puesto'}, {l:'APTO CON RECOMENDACIONES',c:'info',d:'Hallazgos que no limitan; requieren seguimiento o EPP'}, {l:'APTO CON RESTRICCIONES',c:'warn',d:'Puede laborar con adecuación de tareas'}, {l:'NO APTO TEMPORAL',c:'bad',d:'Condición tratable que hoy impide el puesto'}, {l:'EVALUACIÓN PENDIENTE — REFERENCIA INMEDIATA',c:'flag',d:'Bandera roja: atención o valoración urgente antes de dictaminar'} ],
  egr:[ {l:'SIN ALTERACIONES AL EGRESO',c:'ok',d:'Estado de salud sin alteraciones relevantes'}, {l:'EGRESO CON HALLAZGOS EN SEGUIMIENTO',c:'info',d:'Hallazgos menores documentados'}, {l:'EGRESO CON ALTERACIONES — REFERIR',c:'warn',d:'Alteraciones que requieren valoración'}, {l:'EGRESO CON ALTERACIONES — REFERIR',c:'bad',d:'Alteraciones importantes: valoración especializada'}, {l:'REFERENCIA INMEDIATA',c:'flag',d:'Bandera roja detectada'} ]};
const EXTRA_DICT=['NO APTO PARA ESTE PUESTO'];
function analyze(){
  const F=[], rx=new Set(), rc=new Set(); let edt=0, wr=0;
  for(const sec of SECTIONS){ for(const it of visibleItems(sec)){ if(it.t==='h') continue; const e=evalItem(it); if(!e) continue;
    if(e.wr) wr++;
    if(e.sev>0||e.flag) F.push({sec:sec.t,q:it.q,i:e.interp,sev:e.flag?4:e.sev,rel:e.rel});
    if(e.rx) rx.add(e.rx); if(e.rc) rc.add(e.rc); if(e.edt) edt++; }}
  if(S.a.consentimiento==='No') F.push({sec:'Datos de identidad',q:'Consentimiento',i:'Sin consentimiento informado',sev:4});
  for(const k in S.studies){ const st=S.studies[k]; if(st&&st.e==='Alterado'&&!(k==='antidoping'&&st.panel)){ const s=STUDIES.find(x=>x[0]===k); F.push({sec:'Estudios',q:s?s[1]:k,i:'Resultado alterado: '+(st.r||''),sev:2}); }}
  const ad=S.studies.antidoping, adPos=(ad?.sel||[]).filter(x=>ad.res?.[x]==='Positivo');
  if(adPos.length){ const crit=hasAny(S,CRIT); F.push({sec:'Estudios',q:'Antidoping de '+ad.panel+' elementos',i:'Positivo a: '+adPos.join(', ')+'. Resultado de tamizaje: requiere prueba confirmatoria',sev:crit?2:1,rel:crit?CRIT.filter(c=>has(S,c)):null}); if(crit) rx.add('Sin tareas críticas hasta prueba confirmatoria de antidoping y valoración médica'); }
  const max=F.reduce((m,f)=>Math.max(m,f.sev),0);
  F.sort((a,b)=>b.sev-a.sev);
  const set=S.a.tipo==='Egreso'?LEVELS.egr:LEVELS.std, lvl=set[max];
  const edtSusp = edt>0 && (wr>0 || S.a.tipo!=='Ingreso');
  if(rc.size===0&&max===0) rc.add('Mantener hábitos saludables y uso correcto del EPP asignado');
  if(edtSusp) rc.add('Sospecha de enfermedad de trabajo: documentar exposición, referir a Medicina del Trabajo y orientar al trabajador a su UMF IMSS (formato ST-9)');
  if(has(S,'ruido')) rc.add('Protección auditiva obligatoria en áreas ≥ 85 dB(A)');
  if(hasAny(S,RESP)) rc.add('Uso de protección respiratoria adecuada al contaminante');
  const next=nextSteps();
  return {F,max,lvl,lvlIdx:max,rx:[...rx],rc:[...rc],edt:edtSusp,studies:suggestedStudies(),next,flags:F.filter(f=>f.sev===4)};
}
function suggestedStudies(){ return STUDIES.filter(s=>{ try{return s[2](S)}catch(e){return false} }); }
function nextSteps(){ const n=[];
  for(const sec of SECTIONS){ for(const it of visibleItems(sec)){ if(it.man&&S.a[it.id]==null) n.push(`Explorar ${it.q} — pertinente al puesto`); }}
  if(S.a.pas==null&&S.step>0) n.push('Registrar signos vitales');
  if(S.chips.length===0&&S.a.perfil) n.push('Confirmar los riesgos del puesto');
  const pend=suggestedStudies().filter(s=>!S.studies[s[0]]?.e); if(pend.length) n.push(`${pend.length} estudio(s) sugerido(s) sin registrar`);
  return n.slice(0,5); }

function initSigs(){ document.querySelectorAll('canvas[data-sig]').forEach(c=>{ const w=c.dataset.sig, x=c.getContext('2d'); x.lineWidth=3; x.lineCap='round'; x.strokeStyle='#14263a';
  if(S.sig[w]){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0); im.src=S.sig[w]; }
  let dn=false; const p=e=>{const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(!dn)return;x.lineTo(...p(e));x.stroke()};
  c.onpointerup=()=>{dn=false;S.sig[w]=c.toDataURL('image/png');saveDraft()}; }); }
